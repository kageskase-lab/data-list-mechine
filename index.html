<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data List Mechine</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; --pri:#2563eb; --red:#dc2626; --green:#16a34a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111827; --card:#1f2937; --text:#f3f4f6; --muted:#9ca3af; --line:#374151; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Arial, sans-serif; background:var(--bg); color:var(--text); padding:20px; }
  .wrap { max-width:1100px; margin:auto; }
  h1 { margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:4px; }
  input, select, textarea { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); font:inherit; }
  button { padding:8px 14px; border:0; border-radius:6px; cursor:pointer; color:#fff; background:var(--pri); font:inherit; }
  button.green { background:var(--green); } button.red { background:var(--red); } button.gray { background:#6b7280; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:760px; }
  th, td { padding:8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  th { font-size:13px; color:var(--muted); }
  td button { padding:5px 10px; font-size:13px; margin-right:4px; }
  .empty { text-align:center; color:var(--muted); padding:20px; }
  .badge { padding:2px 8px; border-radius:20px; font-size:12px; color:#fff; }
  .Sudah { background:var(--green); } .Belum { background:var(--red); } .Proses { background:#d97706; }
  #info { font-size:12px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Data List Mechine</h1>

  <div class="card">
    <div class="grid">
      <div><label>WSID</label><input id="wsid"></div>
      <div><label>Nama Lokasi</label><input id="lokasi"></div>
      <div><label>Vendor</label><input id="vendor"></div>
      <div><label>Status PM</label>
        <select id="status"><option>Sudah PM</option><option>Belum PM</option><option>Proses</option></select></div>
      <div><label>Catatan</label><input id="catatan"></div>
    </div>
    <div class="bar">
      <button class="green" id="btnSave">Save</button>
      <button class="gray" id="btnCancel">Cancel</button>
    </div>
  </div>

  <div class="card">
    <div class="bar" style="margin:0 0 12px">
      <button id="btnImport">Import Excel</button>
      <button id="btnExport">Export Excel</button>
      <button class="red" id="btnDelMode">Delete</button>
      <button class="red" id="btnDelOk" hidden>Hapus Terpilih</button>
      <button class="gray" id="btnDelCancel" hidden>Batal</button>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
    </div>
    <div class="scroll">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <div id="info"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const STATUS = ['Sudah PM', 'Belum PM', 'Proses'];
let data = [], mode = 'server', editId = null, delMode = false;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load() {
  try {
    const r = await fetch('/api/data');
    if (!r.ok) throw 0;
    data = await r.json();
    mode = 'server';
  } catch {
    mode = 'local';
    try { data = JSON.parse(localStorage.getItem('dlm') || '[]'); } catch { data = []; }
  }
  $('info').textContent = mode === 'server'
    ? 'Data tersimpan di server (data/data.json).'
    : 'Server tidak terdeteksi, data disimpan di browser (localStorage).';
  render();
}

async function persist() {
  if (mode === 'server') {
    await fetch('/api/data', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  } else {
    try { localStorage.setItem('dlm', JSON.stringify(data)); } catch {}
  }
}

function render() {
  $('head').innerHTML = (delMode ? '<th>Pilih</th>' : '') +
    '<th>WSID</th><th>Nama Lokasi</th><th>Vendor</th><th>Status PM</th><th>Catatan</th>' +
    (delMode ? '' : '<th>Aksi</th>');
  const cols = delMode ? 5 : 6;
  if (!data.length) { $('body').innerHTML = `<tr><td colspan="${cols}" class="empty">Belum ada data</td></tr>`; return; }

  $('body').innerHTML = data.map(d => {
    const pick = delMode ? `<td><input type="checkbox" class="pick" value="${d.id}" style="width:auto"></td>` : '';
    if (d.id === editId) {
      return `<tr>${pick}
        <td><input id="e_wsid" value="${esc(d.wsid)}"></td>
        <td><input id="e_lokasi" value="${esc(d.lokasi)}"></td>
        <td><input id="e_vendor" value="${esc(d.vendor)}"></td>
        <td><select id="e_status">${STATUS.map(s => `<option ${s === d.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
        <td><input id="e_catatan" value="${esc(d.catatan)}"></td>
        <td><button class="green" data-act="saveEdit" data-id="${d.id}">Simpan</button>
            <button class="gray" data-act="cancelEdit">Batal</button></td></tr>`;
    }
    const cls = (d.status || '').split(' ')[0];
    return `<tr>${pick}<td>${esc(d.wsid)}</td><td>${esc(d.lokasi)}</td><td>${esc(d.vendor)}</td>
      <td><span class="badge ${cls}">${esc(d.status)}</span></td><td>${esc(d.catatan)}</td>
      ${delMode ? '' : `<td><button data-act="edit" data-id="${d.id}">Edit</button></td>`}</tr>`;
  }).join('');
}

function clearForm() { ['wsid','lokasi','vendor','catatan'].forEach(i => $(i).value = ''); $('status').selectedIndex = 0; }

$('btnSave').onclick = async () => {
  const wsid = $('wsid').value.trim();
  if (!wsid) return alert('WSID wajib diisi');
  data.push({ id: Date.now() + Math.random().toString(16).slice(2, 6), wsid, lokasi: $('lokasi').value.trim(),
    vendor: $('vendor').value.trim(), status: $('status').value, catatan: $('catatan').value.trim() });
  await persist(); clearForm(); render();
};
$('btnCancel').onclick = clearForm;

$('body').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'edit') { editId = id; render(); }
  if (act === 'cancelEdit') { editId = null; render(); }
  if (act === 'saveEdit') {
    const d = data.find(x => x.id === id);
    d.wsid = $('e_wsid').value.trim(); d.lokasi = $('e_lokasi').value.trim(); d.vendor = $('e_vendor').value.trim();
    d.status = $('e_status').value; d.catatan = $('e_catatan').value.trim();
    editId = null; await persist(); render();
  }
};

function setDel(on) {
  delMode = on; editId = null;
  $('btnDelMode').hidden = on; $('btnDelOk').hidden = !on; $('btnDelCancel').hidden = !on;
  render();
}
$('btnDelMode').onclick = () => { if (!data.length) return alert('Tidak ada data'); alert('Pilih data yang ingin dihapus, lalu klik "Hapus Terpilih".'); setDel(true); };
$('btnDelCancel').onclick = () => setDel(false);
$('btnDelOk').onclick = async () => {
  const ids = [...document.querySelectorAll('.pick:checked')].map(c => c.value);
  if (!ids.length) return alert('Belum ada data yang dipilih');
  if (!confirm(`Hapus ${ids.length} data terpilih?`)) return;
  data = data.filter(d => !ids.includes(d.id));
  await persist(); setDel(false);
};

$('btnExport').onclick = () => {
  const rows = data.map(d => ({ 'WSID': d.wsid, 'Nama Lokasi': d.lokasi, 'Vendor': d.vendor, 'Status PM': d.status, 'Catatan': d.catatan }));
  const ws = XLSX.utils.json_to_sheet(rows, { header: ['WSID','Nama Lokasi','Vendor','Status PM','Catatan'] });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Data');
  XLSX.writeFile(wb, 'Data List Mechine.xlsx');
};

$('btnImport').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const wb = XLSX.read(await f.arrayBuffer());
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
  const get = (r, k) => { const key = Object.keys(r).find(x => x.trim().toLowerCase() === k); return key ? String(r[key]).trim() : ''; };
  let n = 0;
  rows.forEach(r => {
    const wsid = get(r, 'wsid'); if (!wsid) return;
    data.push({ id: Date.now() + Math.random().toString(16).slice(2, 8), wsid, lokasi: get(r, 'nama lokasi'),
      vendor: get(r, 'vendor'), status: get(r, 'status pm') || 'Belum PM', catatan: get(r, 'catatan') });
    n++;
  });
  await persist(); render(); e.target.value = '';
  alert(`${n} data berhasil diimpor`);
};

load();
</script>
</body>
</html>
